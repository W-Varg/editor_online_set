<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editor Online - API Docs</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
const spec = {
  openapi: "3.0.3",
  info: {
    title: "Editor Online API",
    description: "Backend para el editor de documentos online con soporte para ONLYOFFICE y Collabora.",
    version: "0.1.0"
  },
  servers: [{ url: "/", description: "Backend local" }],
  components: {
    securitySchemes: {
      bearerAuth: {
        type: "http",
        scheme: "bearer",
        bearerFormat: "JWT"
      }
    },
    schemas: {
      LoginRequest: {
        type: "object",
        required: ["username", "password"],
        properties: {
          username: { type: "string", example: "user1" },
          password: { type: "string", example: "Admin123@" }
        }
      },
      AuthResponse: {
        type: "object",
        properties: {
          token: { type: "string" },
          user: { $ref: "#/components/schemas/User" }
        }
      },
      User: {
        type: "object",
        properties: {
          id: { type: "string" },
          username: { type: "string" },
          name: { type: "string" },
          dni: { type: "string", nullable: true },
          cargo: { type: "string", nullable: true }
        }
      },
      CreateDocument: {
        type: "object",
        required: ["name", "ext", "editor"],
        properties: {
          name: { type: "string", example: "Mi documento" },
          ext: { type: "string", example: "docx" },
          editor: { type: "string", example: "onlyoffice" }
        }
      },
      Document: {
        type: "object",
        properties: {
          id: { type: "string" },
          name: { type: "string" },
          ext: { type: "string" },
          mime: { type: "string" },
          editor: { type: "string" },
          size: { type: "integer" },
          status: { type: "string" },
          owner_id: { type: "string" },
          owner_name: { type: "string" },
          created_at: { type: "string", format: "date-time" },
          updated_at: { type: "string", format: "date-time" },
          shared: { type: "boolean", nullable: true },
          shared_by: { type: "string", nullable: true },
          shared_by_name: { type: "string", nullable: true }
        }
      },
      CollaboraSession: {
        type: "object",
        properties: {
          iframe_url: { type: "string" },
          access_token: { type: "string" }
        }
      },
      OnlyOfficeConfig: {
        type: "object",
        properties: {
          document: { type: "object" },
          documentType: { type: "string" },
          editorConfig: { type: "object" },
          token: { type: "string", nullable: true }
        }
      },
      ConvertResponse: {
        type: "object",
        properties: {
          pdf_id: { type: "string" },
          pdf_url: { type: "string" },
          status: { type: "string" }
        }
      },
      ShareRequest: {
        type: "object",
        required: ["user_id"],
        properties: {
          user_id: { type: "string" }
        }
      },
      ShareResponse: {
        type: "object",
        properties: {
          id: { type: "string" },
          document_id: { type: "string" },
          user_id: { type: "string" },
          user_name: { type: "string" },
          shared_by: { type: "string" },
          shared_by_name: { type: "string" },
          permission: { type: "string" },
          created_at: { type: "string" }
        }
      },
      UserSearchResult: {
        type: "object",
        properties: {
          id: { type: "string" },
          username: { type: "string" },
          name: { type: "string" },
          dni: { type: "string", nullable: true },
          cargo: { type: "string", nullable: true }
        }
      }
    }
  },
  paths: {
    "/": {
      get: {
        summary: "Root — estado del servidor",
        tags: ["Sistema"],
        responses: {
          "200": {
            description: "Server info",
            content: { "application/json": { schema: { type: "object" } } }
          }
        }
      }
    },
    "/health": {
      get: {
        summary: "Health check",
        tags: ["Sistema"],
        responses: {
          "200": {
            description: "Servidor saludable",
            content: { "application/json": { schema: { type: "object" } } }
          }
        }
      }
    },
    "/api/auth/login": {
      post: {
        summary: "Iniciar sesión",
        tags: ["Auth"],
        requestBody: {
          required: true,
          content: { "application/json": { schema: { $ref: "#/components/schemas/LoginRequest" } } }
        },
        responses: {
          "200": { description: "Login exitoso", content: { "application/json": { schema: { $ref: "#/components/schemas/AuthResponse" } } } },
          "401": { description: "Credenciales inválidas" }
        }
      }
    },
    "/api/documents": {
      get: {
        summary: "Listar documentos (Míos/Compartidos)",
        tags: ["Documentos"],
        security: [{ bearerAuth: [] }],
        parameters: [
          { name: "tab", in: "query", schema: { type: "string", enum: ["mine", "shared"] } }
        ],
        responses: {
          "200": { description: "Lista de documentos", content: { "application/json": { type: "array", items: { $ref: "#/components/schemas/Document" } } } }
        }
      },
      post: {
        summary: "Crear documento",
        tags: ["Documentos"],
        security: [{ bearerAuth: [] }],
        requestBody: { required: true, content: { "application/json": { schema: { $ref: "#/components/schemas/CreateDocument" } } } },
        responses: {
          "201": { description: "Documento creado", content: { "application/json": { schema: { $ref: "#/components/schemas/Document" } } } }
        }
      }
    },
    "/api/documents/{id}": {
      get: {
        summary: "Obtener documento",
        tags: ["Documentos"],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: {
          "200": { description: "Documento", content: { "application/json": { schema: { $ref: "#/components/schemas/Document" } } } }
        }
      },
      delete: {
        summary: "Eliminar/quitar acceso a documento",
        tags: ["Documentos"],
        security: [{ bearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Operación exitosa" } }
      }
    },
    "/api/documents/{id}/content": {
      get: {
        summary: "Descargar contenido del documento",
        tags: ["Documentos"],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Binary content" } }
      }
    },
    "/api/documents/{id}/convert": {
      post: {
        summary: "Convertir documento a PDF",
        tags: ["Documentos"],
        security: [{ bearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Resultado de conversión", content: { "application/json": { schema: { $ref: "#/components/schemas/ConvertResponse" } } } } }
      }
    },
    "/api/documents/{id}/pdf": {
      get: {
        summary: "Descargar PDF",
        tags: ["Documentos"],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "PDF content" } }
      }
    },
    "/api/documents/{id}/shares": {
      get: {
        summary: "Listar usuarios con acceso al documento",
        tags: ["Compartir"],
        security: [{ bearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Lista de shares", content: { "application/json": { type: "array", items: { $ref: "#/components/schemas/ShareResponse" } } } } }
      },
      post: {
        summary: "Compartir documento con un usuario",
        tags: ["Compartir"],
        security: [{ bearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        requestBody: { content: { "application/json": { schema: { $ref: "#/components/schemas/ShareRequest" } } } },
        responses: { "200": { description: "Share creado", content: { "application/json": { schema: { $ref: "#/components/schemas/ShareResponse" } } } } }
      }
    },
    "/api/documents/{id}/shares/{userId}": {
      delete: {
        summary: "Quitar acceso a un usuario",
        tags: ["Compartir"],
        security: [{ bearerAuth: [] }],
        parameters: [
          { name: "id", in: "path", required: true, schema: { type: "string" } },
          { name: "userId", in: "path", required: true, schema: { type: "string" } }
        ],
        responses: { "200": { description: "Acceso removido" } }
      }
    },
    "/api/users/search": {
      get: {
        summary: "Buscar usuarios para compartir",
        tags: ["Usuarios"],
        security: [{ bearerAuth: [] }],
        parameters: [{ name: "q", in: "query", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Resultados", content: { "application/json": { type: "array", items: { $ref: "#/components/schemas/UserSearchResult" } } } } }
      }
    },
    "/api/collabora/session/{id}": {
      get: {
        summary: "Obtener sesión de Collabora",
        tags: ["Collabora"],
        security: [{ bearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "URL de sesión", content: { "application/json": { schema: { $ref: "#/components/schemas/CollaboraSession" } } } } }
      }
    },
    "/api/onlyoffice/config/{id}": {
      get: {
        summary: "Obtener configuración de ONLYOFFICE",
        tags: ["ONLYOFFICE"],
        security: [{ bearerAuth: [] }],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Configuración del editor", content: { "application/json": { schema: { $ref: "#/components/schemas/OnlyOfficeConfig" } } } } }
      }
    },
    "/wopi/files/{id}": {
      get: {
        summary: "WOPI CheckFileInfo (Collabora)",
        tags: ["WOPI"],
        parameters: [
          { name: "id", in: "path", required: true, schema: { type: "string" } },
          { name: "access_token", in: "query", schema: { type: "string" } }
        ],
        responses: { "200": { description: "File info" } }
      },
      post: {
        summary: "WOPI Lock/Unlock/Refresh (Collabora)",
        tags: ["WOPI"],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Operación WOPI" } }
      }
    },
    "/wopi/files/{id}/contents": {
      get: {
        summary: "WOPI GetFile (Collabora)",
        tags: ["WOPI"],
        parameters: [
          { name: "id", in: "path", required: true, schema: { type: "string" } },
          { name: "access_token", in: "query", schema: { type: "string" } }
        ],
        responses: { "200": { description: "Binary content" } }
      },
      post: {
        summary: "WOPI PutFile (Collabora)",
        tags: ["WOPI"],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Archivo actualizado" } }
      }
    },
    "/download/{id}": {
      get: {
        summary: "Descarga para ONLYOFFICE (sin auth)",
        tags: ["ONLYOFFICE"],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Binary content" } }
      }
    },
    "/callback/onlyoffice/{id}": {
      post: {
        summary: "Callback de ONLYOFFICE (guarda cambios)",
        tags: ["ONLYOFFICE"],
        parameters: [{ name: "id", in: "path", required: true, schema: { type: "string" } }],
        responses: { "200": { description: "Callback procesado" } }
      }
    }
  }
};
SwaggerUIBundle({ spec, dom_id: "#swagger-ui", deepLinking: true });
</script>
</body>
</html>
