<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!--
    SDK de plugins de ONLYOFFICE cargado desde el CDN oficial, igual que el resto
    de plugins servidos externamente por el backend. plugins.css aporta las clases
    de UI nativas (.form-control, .btn-text-default, .label, ...) para heredar la
    apariencia del editor. Los estilos propios del layout viven en
    resources/styles/style.css (cargado después del SDK), como hacen los plugins
    de la comunidad.
  -->
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
  <link rel="stylesheet" href="resources/styles/style.css">
  <script type="text/javascript" src="plugin.js"></script>
</head>
<body class="body share-body">
  <!-- Panel lateral (isInsideMode): buscador + resultados + estado. -->
  <div class="share-main">
    <label class="label" for="search-input">Buscar por DNI o nombre</label>
    <div class="share-search">
      <input id="search-input" class="form-control share-search-input" type="search" placeholder="dni o nombre" autocomplete="off">
      <div id="btn-buscar" class="btn-text-default share-search-btn">Buscar</div>
    </div>
    <div id="results" class="share-list"></div>
    <div id="status" class="share-status"></div>
  </div>
  <div class="button_wrapper">
    <div id="btn-cerrar" class="btn-text-default">Cerrar</div>
    <div id="btn-guardar" class="btn-text-default share-btn-right share-btn-primary">Guardar</div>
  </div>
</body>
</html>
