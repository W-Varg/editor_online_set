<!DOCTYPE html>
<html lang="es" style="height: stretch;">
<head>
  <meta charset="UTF-8">
  <!--
    Ventana modal del plugin "Previsualizar" (abierta con PluginWindow desde
    plugin.js). Carga el SDK desde el CDN para heredar los estilos nativos de
    ONLYOFFICE y muestra el PDF generado por el backend dentro de un iframe.
  -->
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
  <link rel="stylesheet" href="resources/styles/style.css">
  <script type="text/javascript" src="preview.js"></script>
</head>
<body class="body preview-window">
  <div id="preview-loading" class="preview-state">
    <div class="preview-spinner"></div>
    <span id="loading-text">Generating preview...</span>
  </div>
  <div id="preview-error" class="preview-state error" style="display:none;"></div>
  <iframe id="preview-frame" class="preview-frame" style="display:none;"></iframe>
</body>
</html>
