<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!--
    SDK de plugins de ONLYOFFICE. Se carga desde el CDN oficial para que este
    plugin funcione servido externamente desde el backend (cualquier host/puerto)
    sin depender de los archivos internos del contenedor de DocumentServer.

    plugins.css aporta las clases de UI nativas de ONLYOFFICE (.form-control,
    .btn-text-default, .label, .input-container, ...) para que el plugin herede
    la apariencia del editor y no defina estilos propios.
  -->
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
  <script type="text/javascript" src="plugin.js"></script>
</head>
<body class="body" style="margin:0;display:flex;flex-direction:column;height:100%;">
  <!--
    Panel lateral (isInsideMode). Solo usa clases y estilos de ONLYOFFICE.
    El área de contenido ocupa el alto disponible y el footer queda abajo con
    los botones de cierre del panel.
  -->
  <div style="flex:1;padding:16px;">
    <label class="label" for="saludo-input">Texto del saludo</label>
    <input id="saludo-input" class="form-control" type="text" placeholder="Escribe un saludo...">
    <div id="btn-saludar" class="btn-text-default" style="margin-top:12px;">Mostrar saludo</div>
  </div>
  <div class="button_wrapper" style="padding:0 12px 12px;">
    <div id="btn-cancelar" class="btn-text-default">Cancelar</div>
    <div id="btn-cerrar" class="btn-text-default">Cerrar</div>
  </div>
</body>
</html>
